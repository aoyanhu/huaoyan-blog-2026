<!-- PhotoSwipe Lightbox JS (only on single posts) -->
{{ if eq .Kind "page" }}
<script type="module">
  import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe-lightbox.esm.js';

  const lightbox = new PhotoSwipeLightbox({
    gallery: '.post-content',
    children: 'img:not(.no-lightbox)',
    pswpModule: () => import('https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.esm.js'),
    bgOpacity: 0.9,
    padding: { top: 30, bottom: 30, left: 30, right: 30 },
  });

  lightbox.on('uiRegister', function () {
    lightbox.pswp.ui.registerElement({
      name: 'download-button',
      order: 8,
      isButton: true,
      tagName: 'a',
      html: {
        isCustomSVG: true,
        inner: '<path d="M20.5 14.3 17.1 18V10h-2.2v8l-3.4-3.7L10 15.8l5 5.4 5-5.4-1.4-1.5ZM5 20h14v1H5z"/>',
      },
      onInit: (el, pswp) => {
        el.setAttribute('download', '');
        el.setAttribute('target', '_blank');
        el.setAttribute('rel', 'noopener');
        el.setAttribute('title', 'Download this image');
        pswp.on('change', () => {
          el.setAttribute('href', pswp.currSlide.data.src || '');
        });
      },
    });
  });

  lightbox.init();
</script>
{{ end }}
