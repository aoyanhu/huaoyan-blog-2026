# ============================================================
# Site Identity
# ============================================================
baseURL = 'https://huaoyan.top/'
locale = 'zh-cn'
title = "Huaoyan's Blog"

# ============================================================
# Hugo Modules
# ============================================================
[module]
  [[module.imports]]
    path = 'github.com/adityatelange/hugo-PaperMod'

# ============================================================
# Content Settings
# ============================================================
# Enable emoji in content
enableEmoji = true

[permalinks]
  posts = '/posts/:year/:slugorcontentbasename/'

# Syntax highlighting
[markup]
  [markup.highlight]
    style = 'github'
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ============================================================
# Taxonomies
# ============================================================
[taxonomies]
  category = 'categories'
  tag = 'tags'

# ============================================================
# Output (RSS, HTML, etc.)
# ============================================================
[outputs]
  home = ['HTML', 'RSS', 'JSON']

# ============================================================
# Navigation Menu
# ============================================================
[[menu.main]]
  name = '归档'
  url = '/archives/'
  weight = 10

[[menu.main]]
  name = '标签'
  url = '/tags/'
  weight = 20

[[menu.main]]
  name = '分类'
  url = '/categories/'
  weight = 30

[[menu.main]]
  name = '搜索'
  url = '/search/'
  weight = 40

[[menu.main]]
  name = '关于'
  url = '/about/'
  weight = 50

# ============================================================
# PaperMod Theme Parameters
# ============================================================
[params]
  # --- Homepage ---
  [params.homeInfoParams]
    title = "Huaoyan's Blog ✨"
    content = '一个记录与分享的个人空间。<br>日常随想 · 读书笔记 · 摄影记录 · 资源分享'

  # --- Profile / Sidebar ---
  [params.profileMode]
    enabled = false

  # --- Post Display ---
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = false

  # --- Table of Contents ---
  ShowToc = true
  TocOpen = false

  # --- Comments ---
  comments = true

  # --- Search (Fuse.js) ---
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

  # --- Theme ---
  defaultTheme = 'auto'
  disableThemeToggle = false

  # --- Labels ---
  [params.label]
    text = '首页'
    icon = ''
    iconHeight = 35

  # --- Date Format ---
  dateFormat = '2006-01-02'

  # --- Archive ---
  [params.archive]
    layout = 'monthly'
